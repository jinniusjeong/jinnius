<title>터노바 튜브 패키지 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Noto+Serif+KR:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: 리뷰 보드 — 결론 띠 → 레퍼런스 월 → 시안 3장 → 시뮬레이션 표 → 팀 검토. 터노바 가이드 v5: 로열블루 + 코퍼. */
  :root{
    --ground:#F2F3F7; --sheet:#FFFFFF; --well:#E8EAF2;
    --ink:#161D63; --ink-2:#3B4270; --muted:#6A7092;
    --gold:#A3582B; --gold-soft:#F3DCCB; --gold-line:rgba(184,115,51,.5);
    --line:rgba(18,28,74,.12); --line-2:rgba(18,28,74,.22);
    --ok:#2C6E4F; --ok-tint:#E2F0E8; --warn:#8F6512; --warn-tint:#F5ECD8; --bad:#A33A2E; --bad-tint:#F6E4E1;
    --hero:#17208A; --hero-ink:#F6EDE6;
    --display:'Montserrat','Helvetica Neue',Arial,sans-serif;
    --head:'Noto Serif KR','Apple SD Gothic Neo',serif;
    --body:'IBM Plex Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0A0F27; --sheet:#121937; --well:#18204A;
      --ink:#E9EAF4; --ink-2:#C1C5DC; --muted:#8E94B4;
      --gold:#EFA27A; --gold-soft:#3A2418; --gold-line:rgba(239,162,122,.45);
      --line:rgba(233,234,244,.12); --line-2:rgba(233,234,244,.22);
      --ok:#7CCBA2; --ok-tint:#15291F; --warn:#E2B866; --warn-tint:#2B2312; --bad:#EE8A7B; --bad-tint:#2E1714;
      --hero:#0E1458; --hero-ink:#F6EDE6; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0A0F27; --sheet:#121937; --well:#18204A;
    --ink:#E9EAF4; --ink-2:#C1C5DC; --muted:#8E94B4;
    --gold:#EFA27A; --gold-soft:#3A2418; --gold-line:rgba(239,162,122,.45);
    --line:rgba(233,234,244,.12); --line-2:rgba(233,234,244,.22);
    --ok:#7CCBA2; --ok-tint:#15291F; --warn:#E2B866; --warn-tint:#2B2312; --bad:#EE8A7B; --bad-tint:#2E1714;
    --hero:#0E1458; --hero-ink:#F6EDE6; color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
  h1,h2,h3{text-wrap:balance;margin:0}
  h2{font-family:var(--head);font-size:clamp(21px,2.6vw,27px);font-weight:700;letter-spacing:-.01em}
  h3{font-family:var(--head);font-size:17px;font-weight:700}
  p{margin:0}
  a{color:inherit;text-decoration-color:var(--gold-line);text-underline-offset:3px}
  a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  .lede{color:var(--ink-2);max-width:68ch}
  .tag{display:inline-flex;align-items:center;gap:.35em;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
  .tag.gold{border-color:var(--gold-line);color:var(--gold)}
  .tag.ok{background:var(--ok-tint);border-color:transparent;color:var(--ok)}
  .tag.warn{background:var(--warn-tint);border-color:transparent;color:var(--warn)}
  .tag.bad{background:var(--bad-tint);border-color:transparent;color:var(--bad)}

  /* hero */
  .hero{background:var(--hero);color:var(--hero-ink);padding-block:clamp(36px,6vw,64px) clamp(28px,4vw,44px)}
  .hero .eyebrow{color:#F0A57C}
  .hero h1{font-family:var(--head);font-weight:700;font-size:clamp(28px,4.4vw,46px);line-height:1.22;margin-top:14px;letter-spacing:-.015em}
  .hero h1 .oct{font-family:var(--display);font-weight:700;color:#F0A57C}
  .hero .lede{color:#D3D5EE;margin-top:14px}
  .verdict{margin-top:26px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:rgba(240,165,124,.4);border:1px solid rgba(240,165,124,.4)}
  .verdict > div{background:var(--hero);padding:16px 18px;min-width:0}
  .verdict .k{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:#F0A57C;text-transform:uppercase}
  .verdict .v{font-weight:600;margin-top:6px;font-size:15.5px}
  .verdict .s{color:#B3B7DE;font-size:13px;margin-top:4px}
  .alts{margin-top:18px;display:grid;gap:6px;color:#D3D5EE;font-size:14px}
  .alts b{color:#F6EDE6;font-weight:600}

  section{padding-block:clamp(36px,5vw,56px);border-bottom:1px solid var(--line)}
  .sec-head{display:grid;gap:8px;margin-bottom:22px}

  /* tables */
  .tbl{overflow-x:auto;border:1px solid var(--line);background:var(--sheet);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
  th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--well)}
  tr:last-child td{border-bottom:0}
  td.num{font-family:var(--mono);white-space:nowrap}

  /* reference wall */
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .filters button{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--sheet);color:var(--ink-2);cursor:pointer}
  .filters button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
  .wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .ref{background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
  .ref .img{aspect-ratio:1/1;background:#fff;display:grid;place-items:center;overflow:hidden}
  .ref .img img{width:100%;height:100%;object-fit:contain}
  .ref .img.none{background:var(--well);color:var(--muted);font-size:12px;padding:12px;text-align:center}
  .ref .meta{padding:12px 14px 14px;display:grid;gap:6px;min-width:0}
  .ref .brand{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .ref .name{font-weight:600;font-size:14px;line-height:1.4}
  .ref .tags{display:flex;flex-wrap:wrap;gap:5px}
  .ref .why{font-size:12.8px;color:var(--ink-2);line-height:1.55}
  .ref .src{font-size:11.5px;color:var(--muted);word-break:break-all}

  /* concepts */
  .concepts{display:grid;gap:22px}
  .concept{background:var(--sheet);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
  .concept.pick{border-color:var(--gold-line);box-shadow:0 0 0 1px var(--gold-line)}
  .concept figure{margin:0;background:#EEEAE2;min-width:0}
  .concept figure svg{display:block;width:100%;height:auto}
  .concept .body{padding:20px 22px;display:grid;gap:12px;align-content:start;min-width:0}
  .concept .title{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .concept dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:13.5px}
  .concept dt{color:var(--muted);font-size:12.5px;white-space:nowrap}
  .concept dd{margin:0;min-width:0}
  .score{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .score div{border-top:2px solid var(--line-2);padding-top:6px;font-size:12px;color:var(--muted)}
  .score b{display:block;font-family:var(--mono);font-size:16px;color:var(--ink);font-weight:500}
  .detail{margin-top:22px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .detail svg{display:block;width:100%;height:auto}

  /* axes */
  .axes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  .axis{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:8px;align-content:start}
  .axis .n{font-family:var(--display);font-weight:700;font-size:24px;color:var(--gold);line-height:1}
  .axis p{font-size:13.5px;color:var(--ink-2)}
  .axis .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12.5px}
  .axis .pair div{background:var(--well);border-radius:6px;padding:8px 10px}
  .axis .pair b{display:block;font-size:11px;font-family:var(--mono);letter-spacing:.06em;color:var(--muted);font-weight:500;text-transform:uppercase}

  /* team */
  .team{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
  .seat{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:8px;align-content:start}
  .seat .role{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .seat .role b{font-size:14.5px}
  .seat p{font-size:13.5px;color:var(--ink-2)}
  .seat .ask{font-size:12.8px;border-top:1px dashed var(--line-2);padding-top:8px;color:var(--ink)}
  .chief{margin-top:20px;background:var(--hero);color:var(--hero-ink);border-radius:12px;padding:clamp(20px,3vw,30px);display:grid;gap:14px}
  .chief .eyebrow{color:#F0A57C}
  .chief h3{font-size:20px}
  .chief ol{margin:0;padding-left:20px;display:grid;gap:8px;color:#DADCF0;font-size:14.5px}
  .chief .veto{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .chief .veto div{border:1px solid rgba(240,165,124,.45);border-radius:8px;padding:12px 14px;font-size:14px;color:#DADCF0}
  .chief .veto b{color:#F6EDE6;display:block;margin-bottom:4px}

  .steps{display:grid;gap:0;counter-reset:s;border:1px solid var(--line);border-radius:10px;background:var(--sheet);overflow:hidden}
  .steps li{list-style:none;display:grid;grid-template-columns:110px 1fr;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px}
  .steps li:last-child{border-bottom:0}
  .steps .when{font-family:var(--mono);font-size:12px;color:var(--gold);padding-top:2px}
  .src-list{columns:2 320px;font-size:12.5px;color:var(--muted);padding-left:18px}
  .src-list li{break-inside:avoid;margin-bottom:4px;word-break:break-all}
  footer{padding-block:28px 48px;color:var(--muted);font-size:12.5px}


  /* combos */
  .combos{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .combo,.jarc{background:var(--sheet);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
  .combo.pick{border-color:var(--gold-line);box-shadow:0 0 0 1px var(--gold-line)}
  .combo figure,.jarc figure,.bview figure{margin:0;background:#EFECE6}
  .combo svg,.jarc svg,.bview svg{display:block;width:100%;height:auto}
  .cb{padding:14px 16px 16px;display:grid;gap:8px;align-content:start;min-width:0}
  .ct{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .ct h3{font-size:15.5px}
  .cid{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .cb p{font-size:13.3px;color:var(--ink-2)}
  .axrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .ax{font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--well);color:var(--muted)}
  .ax.on{background:var(--ok-tint);color:var(--ok)}
  .sc{font-family:var(--mono);font-size:13px;margin-left:auto;color:var(--ink)}
  .warn{margin:0;padding-left:16px;font-size:12.3px;color:var(--warn);display:grid;gap:2px}
  .from{font-size:12px;color:var(--muted)}
  .load{justify-self:start;font:inherit;font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--ink);cursor:pointer}
  .load:hover{border-color:var(--gold);color:var(--gold)}
  .subh{margin:34px 0 14px;font-size:19px}
  .chart{margin:0 0 20px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .chart svg{display:block;width:100%;height:auto}
  .chart figcaption{padding:10px 14px;font-size:12.5px;color:var(--muted)}
  .sns{font-size:12.8px;color:var(--ink);background:var(--well);border-radius:6px;padding:6px 9px}
  .sns b{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--gold);margin-right:4px}
  .held{margin-top:34px;border-top:1px solid var(--line);padding-top:16px}
  .held summary{cursor:pointer;font-weight:600;color:var(--ink-2)}
  .jars{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .builder{display:grid;grid-template-columns:1fr;gap:18px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:18px;align-items:start}
  .bctl{display:grid;gap:14px;min-width:0}
  .brow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .brow label{font-size:12.5px;color:var(--muted)}
  .builder select,.brow button{font:inherit;font-size:13px;padding:6px 8px;border-radius:7px;border:1px solid var(--line-2);background:var(--ground);color:var(--ink);max-width:100%}
  .brow button{cursor:pointer;padding:6px 12px}
  .sides{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
  .combo.boss{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
  .combo.boss figure{height:100%}
  .side{border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
  .side .lg{font-weight:600;font-size:13.5px;margin-bottom:2px}
  .side label{font-size:11.5px;color:var(--muted);margin-top:4px}
  .side select{width:100%}
  .side .chk{display:flex;gap:6px;align-items:center;color:var(--ink-2);font-size:12.5px;margin-top:8px}
  .bview{display:grid;gap:10px;min-width:0}
  .bview figure{border-radius:10px;overflow:hidden}
  .brow select{flex:1 1 220px;min-width:0;width:100%}
  .side{min-inline-size:0;align-content:start}
  .side select{min-width:0}
  .bnote{font-size:12px;color:var(--muted)}
  @media (max-width:820px){ .builder{grid-template-columns:1fr} .sides{grid-template-columns:1fr} .combos{grid-template-columns:1fr} .combo.boss{grid-template-columns:1fr} }
  @media (max-width:820px){
    .concept{grid-template-columns:1fr}
    .verdict{grid-template-columns:1fr}
    .score{grid-template-columns:repeat(2,minmax(0,1fr))}
    .steps li{grid-template-columns:1fr;gap:2px}
  }
  @media (prefers-reduced-motion:no-preference){ .ref{transition:transform .18s ease} .ref:hover{transform:translateY(-2px)} }
</style>
