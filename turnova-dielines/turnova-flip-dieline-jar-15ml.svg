<text x="40" y="262.5" font-size="3.1" fill="#000">TURNOVA 플립 단상자 칼선 · jar-15ml · 내치수 W48×D48×H42 mm (가정: 자 Ø45×H38)</text>
<text x="40" y="267.5" font-size="3.1" fill="#000">구조: 앞표지(C)가 좌측면 앞모서리에 경첩 → 열면 안쪽 정면(I)·우측면(R)에 클레임·비포/애프터 (샬롯 틸버리식)</text>
<text x="40" y="272.5" font-size="3.1" fill="#000">접착날개는 I 끝 → L 안쪽에 접착. 상·하 턱은 후면 B에 연결(STE). 표지 안쪽면은 별도 인쇄(사용법·8 PM 리추얼) 시 양면 인쇄</text>
<text x="40" y="277.5" font-size="3.1" fill="#000">닫힘 유지: 표지 폭 +1mm 감쌈 + 엄지 홈. 필요 시 투명 원형 씰(Ø15) 또는 마이크로 자석 (업체 확인)</text>
<text x="40" y="282.5" font-size="3.1" fill="#000">※ 비포/애프터·% 클레임은 인체적용시험 실증 + 시험 조건(*) 병기 후에만 인쇄 (가이드 9-1). 치수는 가정값</text>
